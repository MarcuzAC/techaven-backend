<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Reset Your Password</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .container { max-width: 600px; margin: 0 auto; }
        .button { background-color: #4CAF50; color: white; padding: 12px 24px; 
                  text-decoration: none; border-radius: 4px; display: inline-block; }
        .code { font-family: monospace; font-size: 24px; letter-spacing: 8px; 
                padding: 15px; background-color: #f5f5f5; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Reset Your Password</h2>
        <p>Click the button below to reset your password:</p>
        <p><a href="{{ reset_url }}" class="button">Reset Password</a></p>
        <p>Or use this code: <span class="code">{{ reset_token }}</span></p>
        <p>This link will expire in {{ expiry_hours }} hours.</p>
    </div>
</body>
</html>
